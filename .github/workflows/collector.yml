name: Czech Media Collector

on:
  schedule:
    - cron: "0 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: czech-media-collector
  cancel-in-progress: false

jobs:

  run:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m pytest tests/ -q

      - name: Run Czech Media Collector
        env:
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          MONTHLY_CHARACTER_LIMIT: "1800000"
          TRANSLATION_BATCH_SIZE: "25"
          PYTHONUNBUFFERED: "1"
        run: |
          python -u collector.py

      - name: Commit updated news feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Czech news feeds"
            git pull --rebase origin main
            git push origin main
          fi
