name: Czech Media Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: czech-media-collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONUNBUFFERED: "1"
      PYTHONFAULTHANDLER: "1"

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache translation and NER models
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: nllb-1.3b-robeczech-ner-v1
          restore-keys: |
            nllb-200-distilled-1.3b-v1

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip

          pip install "torch>=2.6,<3" \
            --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run regression tests
        run: |
          python -m pytest tests/ -q

      - name: Run collector
        env:

          MODEL_NAME: "facebook/nllb-200-distilled-1.3B"

          NER_MODEL_NAME: "popelucha/robeczech-NER"

          KEEP_HOURS: "48"

          TRANSLATE_LIMIT: "60"
          UPGRADE_LIMIT: "30"
          RETRY_LIMIT: "10"

          BATCH_SIZE: "8"
          NER_BATCH_SIZE: "16"
          ARTICLE_GROUP_SIZE: "8"

          NUM_BEAMS: "4"
          CPU_THREADS: "4"

          MAX_RUNTIME_MINUTES: "40"

          NER_MIN_CONFIDENCE: "0.85"

          ENABLE_NER: "1"

          TRANSLATE_ALL: "0"

          UPGRADE_ACTIVE_ARTICLES: "1"
          UPGRADE_HISTORICAL_ARTICLES: "0"

        run: |
          python -X faulthandler -u collector.py
          ls -lah data

      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          if [ ! -d data ]; then
            echo "No data directory found"
            exit 0
          fi

          git add data/*.json

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit -m "Auto-update Czech media data"

            git pull --rebase origin main

            git push origin main

          fi
