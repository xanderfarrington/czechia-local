name: Czech Media Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: czech-media-collector
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run collector
        env:
          KEEP_HOURS: "48"
          TRANSLATION_DELAY: "1.5"
          OUT_JSON: "data/articles_latest.json"
          ARCHIVE_JSON: "data/articles_archive.json"
        run: |
          python -u collector.py
          ls -lah data

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/*.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update article JSON files"
            git push
          fi
